name: Test Download Scripts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # NOTE: macos-latest is ARM, macos-13 is Intel.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          environments: data-download
          cache: true
          frozen: true

      - name: Tests download scripts
        run: |
          pixi run test-all-downloads

      - name: Inspect download directory
        run: |
          du -sh data/weather_data/*

    